<!DOCTYPE html>
<html lang="sr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout</title>
    <link
      rel="icon"
      type="image/png"
      href="https://cdn-icons-png.flaticon.com/512/29/29302.png"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <h1>Checkout</h1>

    <form>
      <fieldset>
        <legend>Podaci o kupcu</legend>

        <label>Ime i prezime:</label><br />
        <input type="text" placeholder="Ime i prezime" required /><br /><br />

        <label>Adresa:</label><br />
        <input type="text" placeholder="Ulica i broj" required /><br /><br />

        <label>Broj stana / sprat (opciono):</label><br />
        <input type="text" placeholder="Broj stana, sprat" /><br /><br />

        <label>Grad:</label><br />
        <select required>
          <option value="">Izaberi grad</option>
          <option>Beograd</option>
          <option>Novi Sad</option>
          <option>Niš</option>
          <option>Niš</option>
          <option>Kragujevac</option>
          <option>Ostalo</option>
        </select>

        <br /><br />

        <label>Zemlja:</label><br />
        <select required>
          <option value="">Izaberi zemlju</option>
          <option>Srbija</option>
          <option>Crna Gora</option>
          <option>BiH</option>
          <option>Hrvatska</option>
          <option>Ostalo</option>
        </select>

        <br /><br />

        <label>Poštanski broj:</label><br />
        <input type="text" placeholder="11000" required /><br /><br />

        <label> <input type="checkbox" /> Sačuvaj kontakt informacije </label>
      </fieldset>

      <br />

      <!-- PLAĆANJE -->
      <fieldset>
        <legend>Plaćanje</legend>

        <!-- PayPal -->
        <label>
          <input type="radio" name="payment" value="paypal" />
          <img
            src="https://cdn-icons-png.flaticon.com/512/174/174861.png"
            width="20"
            alt="PayPal"
            class="paypal-logo"
          />
          PayPal
        </label>

        <br /><br />

        <!-- Gotovina -->
        <label>
          <input type="radio" name="payment" value="cash" /> Plaćanje gotovinom
        </label>

        <br /><br />

        <!-- Kartica -->
        <label>
          <input type="radio" name="payment" value="card" /> Platna kartica
        </label>

        <br /><br />

        <label>Ime vlasnika kartice:</label><br />
        <input type="text" placeholder="Ime na kartici" /><br /><br />

        <label>Broj kartice:</label><br />
        <input type="text" placeholder="1234 5678 9101 1121" /><br /><br />

        <label>Datum isteka:</label><br />
        <input type="text" placeholder="MM/YY" /><br /><br />

        <label>CVC kod:</label><br />
        <input type="text" placeholder="123" /><br /><br />

        <label> <input type="checkbox" /> Sačuvaj podatke o kartici </label>
      </fieldset>

      <br />

      <button type="submit" class="btn">Potvrdi kupovinu</button>
    </form>
  </body>
</html>
