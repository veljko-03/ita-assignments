<!DOCTYPE html>
<html lang="sr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link
      rel="icon"
      type="image/png"
      href="https://cdn-icons-png.flaticon.com/512/29/29302.png"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <!-- HEADER -->
    <header>
      <div class="navbar">
        <!-- Brand (logo + naziv) -->
        <div class="brand">
          <img
            src="https://cdn-icons-png.flaticon.com/512/29/29302.png"
            alt="Biblioteka logo"
            class="logo"
          />
          <span class="logo-title">Biblioteka</span>
        </div>

        <!-- Navbar -->
        <nav class="primary-nav">
          <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">Knjige</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Contact</a></li>
          </ul>
        </nav>

        <!-- Akcije -->
        <div class="actions">
          <div class="search">
            <img
              src="https://cdn-icons-png.flaticon.com/512/54/54481.png"
              alt="Search"
              width="18"
            />
            <input type="text" placeholder="Search" />
          </div>

          <a href="#" class="action-link">
            <img
              src="https://cdn-icons-png.flaticon.com/512/1170/1170678.png"
              alt="Cart"
              width="18"
            />
          </a>

          <a href="../login/index.html" class="action-link">
            <img
              src="https://cdn-icons-png.flaticon.com/512/847/847969.png"
              alt="Login"
              width="18"
            />
          </a>
        </div>
      </div>
    </header>

    <h1>Prijava</h1>

    <!-- LOGIN -->
    <form>
      <fieldset>
        <label>Email adresa:</label><br />
        <input type="email" placeholder="email@example.com" required />
        <br /><br />

        <label>Lozinka:</label><br />
        <input type="password" placeholder="Unesite lozinku" required />
        <br /><br />

        <label> <input type="checkbox" /> Zapamti me </label>
        <button type="button" class="dodatna-dugmad">
          Zaboravili ste lozinku?
        </button>

        <br /><br />

        <button type="submit" class="btn">Uloguj se</button>

        <br /><br />

        <button type="button" class="dodatna-dugmad">Kreiraj nalog</button>

        <br /><br />
      </fieldset>
    </form>
  </body>
</html>
